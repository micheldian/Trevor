version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgis/postgis:15-3.4
    container_name: trevor-postgres
    environment:
      POSTGRES_USER: trevor_user
      POSTGRES_PASSWORD: trevor_pass
      POSTGRES_DB: trevor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - trevor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trevor_user -d trevor_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (OTP storage)
  redis:
    image: redis:7-alpine
    container_name: trevor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trevor-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  # pgAdmin (Database UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trevor-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@trevor.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - trevor-network
    depends_on:
      - postgres

  # Redis Commander (Redis UI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: trevor-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - trevor-network
    depends_on:
      - redis

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  trevor-network:
    driver: bridge
